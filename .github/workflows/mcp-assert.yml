name: mcp-assert

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  assert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041 # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wyre-technology'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build --if-present

      - name: Run MCP baseline assertions
        uses: wyre-technology/mcp-eval-baseline@bbcd7891e9d0904855130959366f58d6f68e01c8 # v1
        with:
          entry: dist/index.js
          canary-tool: datto_list_sites
